<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Photos · Family Tree mockup</title>
  <link rel="stylesheet" href="assets/mock.css" />
</head>
<body data-page="gallery">
  <header class="app-header"></header>
  <nav class="sidenav" aria-label="Main"></nav>

  <main class="app-main">
    <div class="gallery-toolbar">
      <div class="search"><span class="ico">🔍</span><input type="search" id="q" placeholder="Search titles, places, people" autocomplete="off" /></div>
      <div class="chip-row" id="kinds"></div>
      <div class="sort-row"><span id="count"></span><span>Group by: <button class="btn btn--sm btn--ghost" id="groupBtn">Decade</button></span></div>
    </div>
    <div id="grid"></div>
  </main>

  <button class="fab" id="fabAdd" aria-label="Add photo" title="Add photo">📷</button>
  <nav class="tabbar" aria-label="Main"></nav>

  <script src="assets/mock-data.js"></script>
  <script src="assets/mock-store.js"></script>
  <script src="assets/mock-ui.js"></script>
  <script src="assets/pages/gallery.js"></script>
</body>
</html>
