<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Person · Family Tree mockup</title>
  <link rel="stylesheet" href="assets/mock.css" />
</head>
<body data-page="people">
  <header class="app-header"></header>
  <nav class="sidenav" aria-label="Main"></nav>

  <main class="app-main">
    <div id="newBanner" class="banner hidden">Added. Now connect them: add parents, a partner or children below.</div>
    <section class="card" id="hero"></section>

    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="family" aria-selected="true">Family</button>
      <button role="tab" data-tab="timeline" aria-selected="false">Timeline</button>
      <button role="tab" data-tab="photos" aria-selected="false">Photos</button>
      <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
    </div>

    <div class="profile-grid" id="grid">
      <section class="card is-active" data-tab="family" id="family"></section>
      <section class="card" data-tab="timeline" id="timeline"></section>
      <section class="card" data-tab="photos" id="photos"></section>
      <section class="card" data-tab="notes" id="notes"></section>
    </div>
  </main>

  <nav class="tabbar" aria-label="Main"></nav>

  <script src="assets/mock-data.js"></script>
  <script src="assets/mock-store.js"></script>
  <script src="assets/mock-ui.js"></script>
  <script src="assets/kinship.js"></script>
  <script src="assets/pages/person.js"></script>
</body>
</html>
